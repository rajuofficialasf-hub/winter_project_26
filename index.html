<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শীতবস্ত্রের আবেদন অনুসন্ধান পোর্টাল</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hind Siliguri Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-emerald-800">শীতবস্ত্রের আবেদন তালিকা</h1>
            <p class="text-slate-600 mt-1">আপনার স্পট কোড এবং মোবাইল নম্বর দিয়ে জমাকৃত আবেদনগুলো দেখুন</p>
        </div>

        <!-- Search Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <form id="searchForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">স্পট কোড (Spot Code)</label>
                    <input type="text" id="spotCode" required placeholder="যেমন: 401" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">স্বেচ্ছাসেবকের মোবাইল নম্বর</label>
                    <input type="tel" id="mobileNumber" required placeholder="যেমন: 0197531646..." 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                </div>
                <div>
                    <button type="submit" id="searchBtn"
                            class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200">
                        আবেদন খুঁজুন
                    </button>
                </div>
            </form>
        </div>

        <!-- Alert / Error Message -->
        <div id="alertBox" class="hidden bg-amber-50 border border-amber-300 text-amber-800 px-4 py-3 rounded-lg mb-6 text-center font-medium"></div>

        <!-- Result Section (Hidden by default) -->
        <div id="resultSection" class="hidden space-y-6">
            
            <!-- স্বেচ্ছাসেবকের তথ্যের বক্স -->
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-600 border border-slate-200">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-2 gap-x-6 text-slate-800 text-base">
                    <p><span class="font-bold text-slate-600">স্বেচ্ছাসেবকের নামঃ</span> <span id="volName" class="font-semibold">-</span></p>
                    <p><span class="font-bold text-slate-600">মোবাইল নম্বরঃ</span> <span id="volMobile" class="font-semibold">-</span></p>
                    <p><span class="font-bold text-slate-600">স্পট কোডঃ</span> <span id="volSpot" class="font-semibold">-</span></p>
                    <p><span class="font-bold text-slate-600">জেলাঃ</span> <span id="volDistrict" class="font-semibold">-</span></p>
                    <p><span class="font-bold text-slate-600">উপজেলাঃ</span> <span id="volUpazila" class="font-semibold">-</span></p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-200">
                    <p class="text-lg font-bold text-emerald-700">
                        মোট আবেদন <span id="totalCount" class="bg-emerald-100 text-emerald-900 px-3 py-0.5 rounded-full mx-1">০</span> টি
                    </p>
                </div>
            </div>

            <!-- উপকারভোগীদের তালিকার টেবিল -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-emerald-800 text-white text-sm md:text-base">
                                <th class="py-3 px-4 border-b font-semibold text-center w-16">ক্রম</th>
                                <th class="py-3 px-4 border-b font-semibold">উপকারভোগীর নাম</th>
                                <th class="py-3 px-4 border-b font-semibold">পিতা/স্বামীর নাম</th>
                                <th class="py-3 px-4 border-b font-semibold">মোবাইল</th>
                                <th class="py-3 px-4 border-b font-semibold">ঠিকানা (উপজেলা, ইউনিয়ন, গ্রাম)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-200 text-slate-700 text-sm md:text-base">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // এখানে আপনার Supabase URL এবং Anon Key বসান
        // ==========================================
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNja254bHVvbGh6anh2aGhycWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NzA0NjIsImV4cCI6MjEwODI0NjQ2Mn0._Vs3-5EF_o1qEEoa6bHL7zqttgHxL0mgki5CqALLFZQ';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ইংরেজি সংখ্যাকে বাংলায় রূপান্তরের ফাংশন
        function toBanglaNumber(num) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(num).replace(/\d/g, d => banglaDigits[d]);
        }

        // বাংলা সংখ্যাকে ইংরেজিতে রূপান্তর (ইনপুট ক্লিনিংয়ের জন্য)
        function normalizeInput(str) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(str).trim().replace(/[০-৯]/g, d => banglaDigits.indexOf(d));
        }

        // মোবাইল নম্বরের শুরুতে 0 না থাকলে 0 যোগ করে দেখানোর ফাংশন
        function formatPhone(phone) {
            if (!phone) return '-';
            let clean = String(phone).trim();
            if (clean.length === 10 && !clean.startsWith('0')) {
                return '0' + clean;
            }
            return clean;
        }

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const spotCode = normalizeInput(document.getElementById('spotCode').value);
            const mobileNumber = normalizeInput(document.getElementById('mobileNumber').value);
            const searchBtn = document.getElementById('searchBtn');
            const alertBox = document.getElementById('alertBox');
            const resultSection = document.getElementById('resultSection');
            const tableBody = document.getElementById('tableBody');

            // Reset UI
            alertBox.classList.add('hidden');
            resultSection.classList.add('hidden');
            searchBtn.disabled = true;
            searchBtn.innerText = 'খোঁজা হচ্ছে...';

            try {
                // Call Supabase RPC Function
                const { data, error } = await supabaseClient.rpc('get_volunteer_submissions', {
                    p_spot_code: spotCode,
                    p_mobile: mobileNumber
                });

                if (error) throw error;

                if (!data || data.length === 0) {
                    alertBox.innerText = 'প্রদত্ত স্পট কোড এবং মোবাইল নম্বরে কোনো আবেদন পাওয়া যায়নি। দয়া করে সঠিক তথ্য দিন।';
                    alertBox.classList.remove('hidden');
                } else {
                    // প্রথম রো থেকে স্বেচ্ছাসেবকের তথ্য বক্সে বসানো
                    const firstRow = data[0];
                    document.getElementById('volName').innerText = firstRow.volunteer_name || '-';
                    document.getElementById('volMobile').innerText = formatPhone(firstRow.volunteer_mobile);
                    document.getElementById('volSpot').innerText = firstRow.spot_code || '-';
                    document.getElementById('volDistrict').innerText = firstRow.district || '-';
                    document.getElementById('volUpazila').innerText = firstRow.upazila || '-';
                    document.getElementById('totalCount').innerText = toBanglaNumber(data.length);

                    // টেবিলের ডাটা তৈরি
                    tableBody.innerHTML = data.map((row, index) => {
                        const addressParts = [row.upazila, row.union_name, row.village].filter(Boolean);
                        const fullAddress = addressParts.join(', ');

                        return `
                            <tr class="hover:bg-slate-50 transition">
                                <td class="py-3 px-4 text-center font-medium text-slate-600">${toBanglaNumber(index + 1)}</td>
                                <td class="py-3 px-4 font-semibold text-slate-800">${row.beneficiary_name || '-'}</td>
                                <td class="py-3 px-4">${row.guardian_name || '-'}</td>
                                <td class="py-3 px-4 font-mono">${formatPhone(row.beneficiary_mobile)}</td>
                                <td class="py-3 px-4 text-slate-600">${fullAddress || '-'}</td>
                            </tr>
                        `;
                    }).join('');

                    resultSection.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                alertBox.innerText = 'সার্ভার থেকে তথ্য আনতে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।';
                alertBox.classList.remove('hidden');
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerText = 'আবেদন খুঁজুন';
            }
        });
    </script>
</body>
</html>
