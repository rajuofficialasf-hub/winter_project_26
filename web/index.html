<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>শীতবস্ত্র প্রকল্প – আমার আবেদন</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1b2430; --muted: #5d6b7a;
    --accent: #1a6b4a; --accent-text: #fff; --border: #d9e0e7; --err: #b3261e; --head: #eaf3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1d232a; --text: #e8edf2; --muted: #9aa8b6;
            --accent: #3fa578; --accent-text: #0c1a13; --border: #2f3944; --err: #f2867f; --head: #23312a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 "Noto Sans Bengali", "Kalpurush", "Nirmala UI", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr auto; align-items: end; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
          background: var(--bg); color: var(--text); width: 100%; }
  button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { color: var(--err); margin: 0; min-height: 1.5em; }
  .info { display: grid; gap: 8px 24px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .info div span { display: block; font-size: .8rem; color: var(--muted); }
  .info div b { font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--head); position: sticky; top: 0; }
  .total { color: var(--muted); margin: 0 0 8px; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>শীতবস্ত্র প্রকল্প – আপনার পাঠানো আবেদন</h1>

  <section class="card">
    <form id="f" autocomplete="off">
      <label>স্পট কোড
        <input id="spot" name="spot" required maxlength="40">
      </label>
      <label>আপনার মোবাইল নম্বর
        <input id="mobile" name="mobile" required inputmode="tel" maxlength="20" placeholder="01XXXXXXXXX">
      </label>
      <button id="btn" type="submit">দেখুন</button>
    </form>
    <p id="msg" role="alert"></p>
  </section>

  <section id="result" hidden>
    <div class="card info" id="info"></div>
    <div class="card">
      <p class="total" id="total"></p>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>ক্রম</th><th>উপকারভোগীর নাম</th><th>পিতার নাম</th><th>মোবাইল</th><th>ইউনিয়ন</th><th>গ্রাম</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const bn = (n) => Number(n).toLocaleString("bn-BD");

  function cell(tr, text) {
    const td = document.createElement("td");
    td.textContent = text ?? "";   // textContent: ডেটার ভেতরের HTML চলবে না
    tr.appendChild(td);
  }

  function render(d) {
    const v = d.volunteer;
    const info = $("info");
    info.replaceChildren();
    [["নাম", v.name], ["মোবাইল", v.mobile], ["স্পট কোড", v.spot_code],
     ["জেলা", v.district], ["উপজেলা", v.upazila]].forEach(([k, val]) => {
      const div = document.createElement("div");
      const s = document.createElement("span"); s.textContent = k;
      const b = document.createElement("b"); b.textContent = val || "—";
      div.append(s, b); info.appendChild(div);
    });

    $("total").textContent = "মোট আবেদন: " + bn(d.total) + " টি";
    const tbody = $("rows");
    tbody.replaceChildren();
    d.rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      cell(tr, bn(i + 1)); cell(tr, r.name); cell(tr, r.father);
      cell(tr, r.mobile); cell(tr, r.union); cell(tr, r.village);
      tbody.appendChild(tr);
    });
    $("result").hidden = false;
  }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("msg").textContent = "";
    $("result").hidden = true;
    $("btn").disabled = true;
    try {
      const res = await fetch(window.APP_CONFIG.LOOKUP_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ spot_code: $("spot").value, mobile: $("mobile").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { $("msg").textContent = data.error || "কিছু একটা সমস্যা হয়েছে।"; return; }
      render(data);
    } catch {
      $("msg").textContent = "ইন্টারনেট সংযোগ বা সার্ভারে সমস্যা। আবার চেষ্টা করুন।";
    } finally {
      $("btn").disabled = false;
    }
  });
</script>
</body>
</html>
